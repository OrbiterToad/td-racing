<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>APEX performance check</title>
  <style>
    body {
      margin: 20px;
      background: #192724;
      color: #e1e7d4;
      font: 14px monospace;
    }
    pre {
      white-space: pre-wrap;
    }
    iframe {
      width: 1280px;
      height: 900px;
      border: 1px solid #526858;
    }
  </style>
  <h1>APEX performance check</h1>
  <p>
    Runs local assets at a fixed 1280 × 900 viewport. Times are milliseconds per
    operation; lower is better. The simulation sample includes 4,200 tire marks.
  </p>
  <pre id="results">Loading the game…</pre>
  <iframe id="game" title="Benchmark game"></iframe>
  <script type="module">
    const output = document.getElementById('results');
    const frame = document.getElementById('game');
    window.addEventListener('message', async (event) => {
      if (
        event.source !== frame.contentWindow ||
        event.data?.type !== 'apex-performance'
      )
        return;
      const result = event.data;
      output.textContent = result.ok
        ? JSON.stringify(result.benchmark, null, 2)
        : result.error;
      if (result.ok) window.benchmarkResults = result.benchmark;
      if (new URLSearchParams(location.search).has('report')) {
        await fetch('/__result', {
          method: 'POST',
          body: JSON.stringify(result),
        });
      }
    });
    try {
      let html = await (await fetch('../index.html')).text();
      html = html
        .replace(
          '<head>',
          '<head><base href="' + new URL('../', location.href).href + '">',
        )
        .replace(/<link[^>]+href="https:\/\/[^>]+>/g, '')
        .replace(
          '</body>',
          '<script type="module" src="tools/performance-game.js"><' +
            '/script></body>',
        );
      frame.srcdoc = html;
    } catch (error) {
      output.textContent = error.stack;
    }
  </script>
</html>
